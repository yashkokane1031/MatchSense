services:
  - type: web
    name: matchsense-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FOOTBALL_DATA_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
