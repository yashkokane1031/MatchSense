[project]
name = "matchsense"
version = "0.1.0"
description = "Premier League match predictor using Dixon-Coles and XGBoost"
readme = "README.md"
authors = [
    { name = "Yash Kokane", email = "yashkokane10@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    # Core
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    # API
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    # ML
    "statsmodels>=0.14",
    "requests>=2.31",
    "xgboost>=2.0",
    "scikit-learn>=1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.98",
    "pandera>=0.18",
    "httpx>=0.27",
    "ruff>=0.3",
    "mypy>=1.8",
    "pandas-stubs>=3.0.5.260730",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E402"]
"tests/*" = ["E402"]
"scripts/*" = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_configs = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "ml"]
