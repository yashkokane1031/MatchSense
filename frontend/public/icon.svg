<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#22d3ee" stroke-opacity="0.3" stroke-width="1.5" />
  
  <!-- Subtle Ambient Glow -->
  <rect x="6" y="6" width="52" height="52" rx="12" fill="url(#glowGrad)" />

  <!-- Predictive Trajectory & Analytics Waves -->
  <!-- Underlying Grid/Pitch Grid Lines -->
  <path d="M14 44 H50" stroke="#334155" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.6" />
  <path d="M14 34 H50" stroke="#334155" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.3" />

  <!-- Iconic 'M' Integrated with Predictive Signal Curve -->
  <!-- Left Pillar -->
  <path d="M18 44 V24" stroke="url(#accentGrad)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Dynamic Center Dynamic Chevron (Model Convergence) -->
  <path d="M18 24 L32 38 L46 20" stroke="url(#accentGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Right Pillar -->
  <path d="M46 20 V44" stroke="url(#accentGrad)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Predictive Flash / Goal Target Node -->
  <circle cx="46" cy="20" r="4" fill="#34d399" filter="url(#glow)" />
  <circle cx="46" cy="20" r="2" fill="#ffffff" />
  
  <!-- Secondary Predictive Beacon Node -->
  <circle cx="32" cy="38" r="2.5" fill="#22d3ee" />
</svg>
